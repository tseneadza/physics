<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09132b"/>
      <stop offset="55%" stop-color="#0b2248"/>
      <stop offset="100%" stop-color="#0a1634"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#4cc9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4cc9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="76%" cy="56%" r="44%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#9cc5ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="vector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9f2ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5ed7ff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#d9f2ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <g opacity="0.22" stroke="#9ecbff" stroke-width="2" fill="none">
    <circle cx="300" cy="240" r="108"/>
    <circle cx="300" cy="240" r="76"/>
    <circle cx="300" cy="240" r="28" fill="#9ecbff" fill-opacity="0.15"/>
    <circle cx="1060" cy="620" r="128"/>
    <circle cx="1060" cy="620" r="92"/>
    <circle cx="1060" cy="620" r="34" fill="#9ecbff" fill-opacity="0.14"/>
  </g>

  <g stroke-linecap="round" filter="url(#soft)">
    <line x1="120" y1="320" x2="820" y2="320" stroke="url(#vector)" stroke-width="16"/>
    <line x1="90" y1="390" x2="760" y2="390" stroke="url(#vector)" stroke-width="14"/>
    <line x1="70" y1="460" x2="710" y2="460" stroke="url(#vector)" stroke-width="12"/>
  </g>

  <g fill="#57d6ff" opacity="0.9">
    <path d="M820 320 l-38 -25 v50 z"/>
    <path d="M760 390 l-34 -22 v44 z"/>
    <path d="M710 460 l-30 -20 v40 z"/>
  </g>

  <g opacity="0.24" stroke="#a9d5ff" stroke-width="2">
    <line x1="930" y1="250" x2="1460" y2="250"/>
    <line x1="930" y1="250" x2="930" y2="760"/>
  </g>
  <polyline points="940,700 1010,620 1090,650 1180,510 1260,560 1370,360 1450,410"
            fill="none" stroke="#67d6ff" stroke-opacity="0.52" stroke-width="4"/>

  <g fill="#87deff" opacity="0.35">
    <circle cx="1240" cy="190" r="8"/>
    <circle cx="1290" cy="155" r="6"/>
    <circle cx="1350" cy="210" r="7"/>
  </g>
</svg>
